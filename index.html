<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Vial Vault — Premium research peptides. Purity. Potency. Performance. Third-party tested, cold chain protected. Murrells Inlet, South Carolina." />
    <meta property="og:title" content="The Vial Vault | Premium Research Peptides" />
    <meta property="og:description" content="Science you can trust. Results you can see. Premium research peptides — third-party tested, cold chain protected." />
    <meta property="og:type" content="website" />
    <title>The Vial Vault | Premium Research Peptides · SC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        font-family: 'Raleway', sans-serif;
        color: #3D1A28;
        overflow-x: hidden;
        background: linear-gradient(160deg, #FBF0EE 0%, #F5E6E0 40%, #EDD8D0 70%, #F0E4DE 100%);
      }
      #root { min-height: 100vh; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #FBF0EE; }
      ::-webkit-scrollbar-thumb { background: #C4856A; border-radius: 3px; }

      /* ── KEYFRAMES ─────────────────────────────────────────── */
      @keyframes shimmer {
        0%   { background-position: -300% center; }
        100% { background-position: 300% center; }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-10px); }
      }
      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 40px rgba(196,133,106,0.55), 0 0 90px rgba(196,133,106,0.28), 0 0 160px rgba(196,133,106,0.12); }
        50%      { box-shadow: 0 0 80px rgba(196,133,106,0.90), 0 0 160px rgba(196,133,106,0.55), 0 0 260px rgba(196,133,106,0.25); }
      }
      @keyframes logoGlowPulse {
        0%, 100% {
          text-shadow: 0 0 8px rgba(196,133,106,0.4),
                       0 0 20px rgba(196,133,106,0.2),
                       0 0 40px rgba(196,133,106,0.1);
        }
        50% {
          text-shadow: 0 0 14px rgba(196,133,106,0.75),
                       0 0 36px rgba(196,133,106,0.45),
                       0 0 70px rgba(196,133,106,0.25);
        }
      }
      @keyframes navGlowPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.88; }
      }
      @keyframes heroImgGlow {
        0%, 100% { filter: drop-shadow(0 0 18px rgba(196,133,106,0.45)) drop-shadow(0 0 50px rgba(196,133,106,0.18)); }
        50%      { filter: drop-shadow(0 0 38px rgba(196,133,106,0.80)) drop-shadow(0 0 100px rgba(196,133,106,0.35)); }
      }
      @keyframes orbFloat {
        0%, 100% { transform: translate(0,0) scale(1); }
        33%      { transform: translate(20px,-15px) scale(1.05); }
        66%      { transform: translate(-15px,10px) scale(0.97); }
      }
      @keyframes roseGlow {
        0%, 100% { box-shadow: 0 0 18px rgba(196,133,106,0.22), 0 0 36px rgba(196,133,106,0.08); }
        50%      { box-shadow: 0 0 38px rgba(196,133,106,0.55), 0 0 72px rgba(196,133,106,0.22); }
      }

      /* ── SHIMMER TEXT ────────────────────────────────────── */
      .shimmer-text {
        background: linear-gradient(90deg,#7B3345 0%,#C4856A 30%,#D4A090 50%,#C4856A 70%,#7B3345 100%);
        background-size: 300% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 9s linear infinite;
      }

      /* ── PAGE SHIMMER BARS ───────────────────────────────── */
      .page-shimmer-top, .page-shimmer-bottom {
        position: fixed; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg,transparent 0%,#C4856A 20%,#E8C5B8 50%,#C4856A 80%,transparent 100%);
        background-size: 300% 100%;
        animation: shimmer 8s linear infinite;
        z-index: 9997; pointer-events: none;
      }
      .page-shimmer-top  { top: 0; }
      .page-shimmer-bottom { bottom: 0; animation-direction: reverse; }

      /* ── NAV LOGO GLOW BOX ───────────────────────────────── */
      .nav-logo-box {
        padding: 6px 14px;
        border: none;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        cursor: pointer;
      }
      .nav-logo-main {
        font-family: 'Cormorant Garamond', serif;
        font-size: 22px;
        font-weight: 700;
        color: #5A1828;
        letter-spacing: 0.5px;
        line-height: 1.15;
        white-space: nowrap;
        animation: logoGlowPulse 3.5s ease-in-out infinite;
      }
      .nav-logo-sub {
        font-size: 7.5px;
        letter-spacing: 3.5px;
        color: #7B3345;
        text-transform: uppercase;
        font-family: 'Raleway', sans-serif;
        font-weight: 800;
        white-space: nowrap;
      }

      /* ── BUTTONS ─────────────────────────────────────────── */
      .btn-rg { transition: all 0.3s ease !important; }
      .btn-rg:hover {
        opacity: 0.88;
        transform: translateY(-2px) !important;
        box-shadow: 0 10px 28px rgba(196,133,106,0.42) !important;
      }

      /* ── PRODUCT CARDS ───────────────────────────────────── */
      .product-card { transition: all 0.32s ease !important; }
      .product-card:hover {
        transform: translateY(-5px) !important;
        box-shadow: 0 18px 52px rgba(196,133,106,0.22) !important;
      }

      /* ── CONTENT BOXES ON MARBLE ─────────────────────────── */
      .cb-white     { background: rgba(255,255,255,0.96) !important; backdrop-filter: blur(6px); }
      .cb-white-tp  { background: rgba(255,255,255,0.82) !important; backdrop-filter: blur(4px); }
      .cb-blush     { background: rgba(240,216,208,0.92) !important; backdrop-filter: blur(5px); }
      .cb-burg      { background: rgba(100,32,50,0.96)   !important; backdrop-filter: blur(6px); }
      .cb-hero      { background: rgba(251,240,238,0.78) !important; backdrop-filter: blur(3px); }

      /* ── HERO IMAGE GLOW ─────────────────────────────────── */
      .hero-img-glow {
        animation: heroImgGlow 4s ease-in-out infinite, floatAnim 5s ease-in-out infinite;
      }

      /* ── MOBILE ──────────────────────────────────────────── */
      .desk-nav  { display: flex !important; }
      .hamburger { display: none !important; }

      @media (max-width: 768px) {
        .desk-nav     { display: none !important; }
        .hamburger    { display: flex !important; }
        .contact-grid { grid-template-columns: 1fr !important; }
        .hero-btns    { flex-direction: column !important; align-items: stretch !important; }
        .trust-grid   { grid-template-columns: 1fr 1fr !important; }
        .footer-grid  { grid-template-columns: 1fr 1fr !important; }
        .prod-grid    { grid-template-columns: 1fr !important; }
        .section-pad  { padding: 44px 16px !important; }
        .page-hero    { padding: 32px 16px !important; }
        .cart-drawer  { width: 100vw !important; }
      }
      @media (max-width: 480px) {
        .trust-grid  { grid-template-columns: 1fr !important; }
        .footer-grid { grid-template-columns: 1fr !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
