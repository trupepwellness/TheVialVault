<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Vial Vault — Premium research peptides. Purity. Potency. Performance. Third-party tested, cold chain protected. Murrells Inlet, South Carolina." />
    <meta property="og:title" content="The Vial Vault | Premium Research Peptides" />
    <meta property="og:description" content="Science you can trust. Results you can see. Premium research peptides — third-party tested, cold chain protected." />
    <meta property="og:type" content="website" />
    <title>The Vial Vault | Premium Research Peptides · SC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        background: #FBF0EE;
        color: #3D1A28;
        font-family: 'Raleway', sans-serif;
        overflow-x: hidden;
      }
      #root { min-height: 100vh; }

      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #FBF0EE; }
      ::-webkit-scrollbar-thumb { background: #C4856A; border-radius: 3px; }

      /* ── KEYFRAME ANIMATIONS ─────────────────────────────── */
      @keyframes shimmer {
        0%   { background-position: -300% center; }
        100% { background-position: 300% center; }
      }
      @keyframes roseGlow {
        0%, 100% {
          box-shadow: 0 0 18px rgba(196,133,106,0.22),
                      0 0 36px rgba(196,133,106,0.08);
        }
        50% {
          box-shadow: 0 0 38px rgba(196,133,106,0.55),
                      0 0 72px rgba(196,133,106,0.22);
        }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(28px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-10px); }
      }
      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes borderPulse {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 1; }
      }
      @keyframes orbFloat {
        0%, 100% { transform: translate(0,0) scale(1); }
        33%      { transform: translate(20px,-15px) scale(1.05); }
        66%      { transform: translate(-15px,10px) scale(0.97); }
      }

      /* ── SHIMMER TEXT ────────────────────────────────────── */
      .shimmer-text {
        background: linear-gradient(
          90deg,
          #C4856A 0%,
          #E8C5B8 30%,
          #D4A090 50%,
          #E8C5B8 70%,
          #C4856A 100%
        );
        background-size: 300% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 5s linear infinite;
      }

      /* ── SHIMMER BORDER BARS (top + bottom of page) ───── */
      .page-shimmer-top {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #C4856A 20%,
          #E8C5B8 50%,
          #C4856A 80%,
          transparent 100%
        );
        background-size: 300% 100%;
        animation: shimmer 4s linear infinite;
        z-index: 9997;
        pointer-events: none;
      }
      .page-shimmer-bottom {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #C4856A 20%,
          #E8C5B8 50%,
          #C4856A 80%,
          transparent 100%
        );
        background-size: 300% 100%;
        animation: shimmer 4s linear infinite reverse;
        z-index: 9997;
        pointer-events: none;
      }

      /* ── BUTTONS ─────────────────────────────────────────── */
      .btn-rg {
        transition: all 0.3s ease !important;
      }
      .btn-rg:hover {
        opacity: 0.88;
        transform: translateY(-2px) !important;
        box-shadow: 0 10px 28px rgba(196,133,106,0.42) !important;
      }

      /* ── PRODUCT CARDS ───────────────────────────────────── */
      .product-card {
        transition: all 0.32s ease !important;
      }
      .product-card:hover {
        transform: translateY(-5px) !important;
        box-shadow: 0 18px 52px rgba(196,133,106,0.18) !important;
      }

      /* ── RESPONSIVE ──────────────────────────────────────── */
      @media (max-width: 768px) {
        .desktop-nav  { display: none !important; }
        .hamburger    { display: flex !important; }
        .contact-grid { grid-template-columns: 1fr !important; }
        .hero-btns    { flex-direction: column; align-items: center; }
      }
      @media (min-width: 769px) {
        .hamburger { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
